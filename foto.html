<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16a34a">
  <title>Galeri Foto - Labib Abdul Manan</title>
  <style>
    /* Reset & CSS Variables (Tema Estetik & Minimalis dari Index) */
    :root {
      --bg-color: #fcfbf9;
      --card-bg: #ffffff;
      --text-main: #2d2b2a;
      --text-muted: #736f6d;
      --accent: #16a34a; /* Warna hijau aksen */
      --accent-hover: #15803d;
      --accent-light: #f0fdf4;
      --border-color: #e8e5e1;
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 20px;
    }

    /* Container Utama */
    .profile-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      width: 100%;
      max-width: 760px;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    /* Galeri Foto */
    .photo-container {
      display: flex;
      gap: 16px;
      width: 100%;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* Item Foto */
    .photo-item {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border-color);
      cursor: pointer;
    }
    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    /* Overlay Warna Hijau (Fade-in langsung tanpa slide) */
    .photo-item::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(22, 163, 74, 0.6);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .photo-item:hover::after {
      opacity: 1;
    }

    .photo-item:hover img {
      transform: scale(1.05);
    }

    /* Tombol Kembali ke Index */
    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-main);
      background-color: transparent;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background-color: var(--accent-light);
      border-color: var(--accent);
      color: var(--accent-hover);
      transform: translateY(-1px);
    }

    /* ===== Versi HP: galeri grid 2 kolom ===== */
    @media (max-width: 640px) {
      body {
        display: block;
        padding: 16px 12px 32px;
        background: linear-gradient(180deg, #f6f4ef 0%, var(--bg-color) 220px);
      }

      .profile-card {
        max-width: 520px;
        margin: 0 auto;
        padding: 22px 16px;
        gap: 18px;
        border-radius: 16px;
      }

      .section-title {
        font-size: 19px;
      }

      .photo-container {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .photo-item {
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
      }

      /* Matikan efek hover yang suka nyangkut di layar sentuh */
      .photo-item:hover::after {
        opacity: 0;
      }

      .photo-item:hover img {
        transform: none;
      }

      .btn-back {
        width: 100%;
        justify-content: center;
        padding: 12px 22px;
      }
    }
  </style>
</head>
<body>

  <main class="profile-card">
    <h1 class="section-title">Galeri Foto</h1>

    <!-- Galeri Foto -->
    <div class="photo-container">
      <div class="photo-item">
        <img src="foto-1.jpg" alt="Foto Labib 1">
      </div>

      <div class="photo-item">
        <img src="foto-profil.jpg" alt="Foto Labib 2">
      </div>

      <div class="photo-item">
        <img src="foto-2.jpg" alt="Foto Labib 3">
      </div>

      <div class="photo-item">
        <img src="foto-3.jpg" alt="Foto Labib 4">
      </div>

      <div class="photo-item">
        <img src="foto-4.jpg" alt="Foto Labib 5">
      </div>

      <div class="photo-item">
        <img src="foto-5.jpg" alt="Foto Labib 6">
      </div>

      <div class="photo-item">
        <img src="foto-6.jpg" alt="Foto Labib 7">
      </div>
    </div>

    <!-- Tombol Kembali ke Index -->
    <a href="index.html" class="btn-back">
      &larr; Kembali ke Beranda
    </a>
  </main>

</body>
</html>
